<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Configuration management control loop</title>
<desc id="d">A four-stage configuration management workflow from controlled artifacts through change review, approved baseline, and audit trail.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.10"/></filter>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/>
<text x="600" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0f172a">Configuration management control loop</text>
<text x="600" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Maintain integrity, approval status, version history, and traceability</text>
<g font-family="Arial,sans-serif" filter="url(#shadow)">
  <rect x="65" y="160" width="225" height="120" rx="18" fill="white" stroke="#cbd5e1"/>
  <text x="178" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">1. Controlled artifacts</text>
  <text x="178" y="230" text-anchor="middle" font-size="14" fill="#475569">Plan · Budget · List · Risk</text>
  <text x="178" y="252" text-anchor="middle" font-size="14" fill="#475569">Known owner + version</text>

  <rect x="345" y="160" width="225" height="120" rx="18" fill="white" stroke="#cbd5e1"/>
  <text x="458" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">2. Change review</text>
  <text x="458" y="230" text-anchor="middle" font-size="14" fill="#475569">Describe proposed change</text>
  <text x="458" y="252" text-anchor="middle" font-size="14" fill="#475569">Assess significance</text>

  <rect x="625" y="160" width="225" height="120" rx="18" fill="white" stroke="#cbd5e1"/>
  <text x="738" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">3. Approval &amp; baseline</text>
  <text x="738" y="230" text-anchor="middle" font-size="14" fill="#475569">Authorize the revision</text>
  <text x="738" y="252" text-anchor="middle" font-size="14" fill="#475569">Publish current version</text>

  <rect x="905" y="160" width="225" height="120" rx="18" fill="white" stroke="#cbd5e1"/>
  <text x="1018" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">4. Audit trail</text>
  <text x="1018" y="230" text-anchor="middle" font-size="14" fill="#475569">Who · What · When</text>
  <text x="1018" y="252" text-anchor="middle" font-size="14" fill="#475569">Complete traceability</text>
</g>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)">
  <path d="M290 220 H336"/>
  <path d="M570 220 H616"/>
  <path d="M850 220 H896"/>
</g>
<path d="M1018 295 C1018 360 178 360 178 295" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#a)"/>
<text x="600" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Future changes start from the latest approved baseline</text>
</svg>
